plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.openjfx.javafxplugin'
}

javafx {
    modules = [
            'javafx.base',
            'javafx.controls',
            'javafx.fxml',
            'javafx.graphics',
            'javafx.swing',
            'javafx.web'
    ]
}

sourceSets {
    main {
        java.srcDirs = ['main/java']
        kotlin.srcDirs = ['main/java']
        resources.srcDirs = ['main/resources']
    }
    test {
        java.srcDirs = ['test/java']
        resources.srcDirs = []
    }
}

application {
    mainModule = 'atools'
    mainClass = 'com.allan.atools.toolsstartup.ATools'
    applicationDefaultJvmArgs = providers.gradleProperty('packageVmOptions')
            .get()
            .split(/\s+/)
            .findAll { !it.isBlank() }
}

dependencies {
    implementation project(':BaseParty')
    implementation project(':BaseUiLibs')
    implementation project(':JFoenix')

    implementation libs.gson
    implementation libs.kotlin.stdlib
    implementation libs.richtextfx
    implementation libs.annotations
    implementation libs.jna
    implementation libs.imageio.webp

    implementation libs.commonmark.core
    implementation libs.commonmark.tables
    implementation libs.commonmark.strikethrough
    implementation libs.commonmark.autolink
    implementation libs.commonmark.tasks
    implementation libs.commonmark.footnotes
    implementation libs.commonmark.frontmatter
    implementation libs.jsoup
}

tasks.named('compileKotlin', org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
    // Kotlin 不支持替换 JDK 系统模块；编译时使用接口相同的 JDK 25 版本，避免同名模块冲突。
    libraries.setFrom(sourceSets.main.compileClasspath.filter {
        !it.name.startsWith('jdk-jsobject-')
    })
}

tasks.named('compileJava', JavaCompile) {
    dependsOn tasks.named('compileKotlin')
    options.compilerArgumentProviders.add({
        ['--patch-module', "atools=${sourceSets.main.output.asPath}",
         '--add-exports', 'org.commonmark/org.commonmark.internal=atools']
    } as CommandLineArgumentProvider)
}

tasks.named('jar', Jar) {
    archiveFileName = 'atools.jar'
}

tasks.register('runDebug', JavaExec) {
    group = 'application'
    description = '启动使用独立临时数据目录的调试实例。'
    systemProperty 'atools.debug', 'true'
}

tasks.withType(JavaExec).matching { it.name in ['run', 'runDebug'] }.configureEach {
    dependsOn tasks.named('jar'), ':BaseParty:jar', ':BaseUiLibs:jar', ':JFoenix:jar'
    workingDir = rootProject.projectDir
    mainModule.set('atools')
    mainClass.set('com.allan.atools.toolsstartup.ATools')
    modularity.inferModulePath.set(true)
    jvmArgs providers.gradleProperty('packageVmOptions')
            .get()
            .split(/\s+/)
            .findAll { !it.isBlank() }

    doFirst {
        def modulePath = files(
                tasks.named('jar', Jar).get().archiveFile.get().asFile,
                configurations.runtimeClasspath.files
        )
        def jsObjectJars = rootProject.javafxJsObjectJars(modulePath.files)
        jvmArgs '--upgrade-module-path', files(jsObjectJars).asPath
        jvmArgs '--module-path', (modulePath - files(jsObjectJars)).asPath
        classpath = files()
    }
}
